openapi: 3.0.3
info:
  title: StorePOS API
  version: v1
  description: Kontrak bertahap. Operasi verified memiliki schema dan tes HTTP; skeleton belum lengkap. Uang berupa string sen, kuantitas berupa string milli-unit.
servers:
  - url: /
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: storepos_session
  schemas:
    ErrorResponse: {"additionalProperties":false,"properties":{"error":{"additionalProperties":false,"properties":{"code":{"type":"string"},"details":{"items":{"additionalProperties":false,"properties":{"code":{"type":"string"},"field":{"type":"string"},"message":{"type":"string"}},"required":["field","code","message"],"type":"object"},"type":"array"},"message":{"type":"string"},"request_id":{"type":"string"}},"required":["code","message"],"type":"object"}},"required":["error"],"type":"object"}
  parameters:
    BusinessID:
      name: X-Business-ID
      in: header
      required: false
      description: Bisnis aktif; bila kosong memakai bisnis aktif pada sesi.
      schema: {type: string, format: uuid}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Wajib pada aksi finansial/stok tertentu (maks 128 karakter).
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Versi data untuk optimistic locking.
      schema: {type: string}
