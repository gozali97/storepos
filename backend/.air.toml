root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/storepos ./cmd/storepos"
entrypoint = ["./tmp/storepos", "api"]
exclude_dir = ["tmp", "bin", "vendor", "testdata"]
include_ext = ["go", "sql"]
include_file = [".env", "go.mod", "go.sum"]
stop_on_error = true
send_interrupt = true
kill_delay = "5s"
